apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: backend-policy
  namespace: backend
spec:
  selector:
    matchLabels:
      app: backend
  rules:
  - from:
    - source:
        namespaces: ["frontend"]
        principals: ["cluster.local/ns/frontend/sa/default"]
    to:
    - operation:
        methods: ["GET", "POST"]
        ports: ["8080"]

